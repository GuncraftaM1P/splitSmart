name: Deploy Frontend to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: NODE_ENV=development npx eas-cli@latest build --platform android --local --non-interactive

      - name: Submit to Google Play Open Testing
        run: |
          # find the first .aab in the frontend working directory
          AAB=$(find . -type f -name '*.aab' -print -quit)
          if [ -z "$AAB" ]; then
            echo "No .aab artifact found in frontend" >&2
            exit 1
          fi
          echo "Submitting $AAB to Google Play (open testing)"
          npx eas-cli@latest submit --platform android --non-interactive --path="$AAB" --no-wait
